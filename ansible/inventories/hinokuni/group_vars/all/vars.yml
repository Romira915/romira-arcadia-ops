---
target_inventory: hinokuni
apt:
  package:
    - unzip
    - qrencode
    - iptables-persistent
    - cron
    - python3-pip
  install_state: present
user:
  groups:
    - ark
  absent_groups: []
  users:
    - name: romira
      groups:
        - sudo
      password: "{{ vault_user.vault_romira.vault_password }}"
      password_salt: "{{ vault_user.vault_romira.vault_password_salt }}"
      authorized_keys: https://github.com/Romira915.keys
    - name: actions
      groups:
      password: "{{ vault_user.vault_actions.vault_password }}"
      password_salt: "{{ vault_user.vault_actions.vault_password_salt }}"
  absent_users: []
iptables:
  allowed_ports: "{{ vault_iptables.vault_allowed_ports }}"
  allowed_input_interfaces: []
  allowed_forward: []
  allowed_nat: []
samba:
  mount_dir: /mnt/d
  interfaces: enp3s0f1 wlp4s0 enx18ece795cc68
  hosts_allow: 192.168.15.0/24 172.24.20.0/24 100.64.0.0/10
openlitespeed:
  admin:
    user: romira
    password: "{{ vault_openlitespeed.vault_admin.vault_password }}"
  vhosts:
    - name: cloud-hinokuni.romira.dev
      domains:
        - cloud-hinokuni.romira.dev
        - localhost
      root: /var/www/nextcloud/
      user: www-data
      group: www-data
lsphp:
  - php: lsphp83
    package:
      - lsphp83-common
      - lsphp83-curl
      - lsphp83-mysql
      - lsphp83-opcache
      - lsphp83-imap
      - lsphp83-apcu
      - lsphp83-intl
      - lsphp83-memcached
      - lsphp83-redis
      - lsphp83-pear
      - lsphp83-imagick
    lib:
      - libsmbclient-dev
      - zlib1g-dev
      - pkg-config
      - libmagickwand-dev
    pecl:
      package:
        - smbclient
        - memcache
      prompts:
        - null
        - (.*)Enable memcache session handler support? \[yes\]: "yes"
mysql:
  login_user: root
  login_unix_socket: /var/run/mysqld/mysqld.sock
  databases:
    - nextcloud
  users:
    nextcloud:
      name: nextcloud
      password: "{{ vault_mysql.vault_users.vault_nextcloud.vault_password }}"
      priv: nextcloud.*:ALL
nextcloud:
  executable_php: /usr/local/lsws/lsphp83/bin/php
  trusted_domain: cloud-hinokuni.romira.dev
  database: mysql
  database_name: nextcloud
  database_user: "{{ mysql.users.nextcloud.name }}"
  database_pass: "{{ vault_mysql.vault_users.vault_nextcloud.vault_password }}"
  admin_user: romira
  admin_pass: "{{ vault_nextcloud.vault_admin_pass }}"
  data_dir: /mnt/d/nextcloud/data/
  redis_host: localhost
  redis_port: 6379
  apps:
    - files_external
  maintenance_window_start: 14

# Inventory-owned role settings.
tailscale_configure_router: true  # noqa: var-naming[no-role-prefix]
tailscale_connect: false  # noqa: var-naming[no-role-prefix]
tailscale_serve_routes: []  # noqa: var-naming[no-role-prefix]

apt_manage_sources_list: false
apt_src_enable: true
apt_backports_enable: true

# Ubuntu specific
apt_ubuntu_mirror: mirror://mirrors.ubuntu.com/mirrors.txt
apt_ubuntu_security_mirror: http://security.ubuntu.com/ubuntu
apt_ubuntu_universe_enable: true
apt_ubuntu_multiverse_enable: true
apt_ubuntu_backports_enable: true
apt_ubuntu_partner_enable: false
apt_ubuntu_extras_enable: false
# Debian specific
apt_debian_mirror: http://deb.debian.org/debian/
apt_debian_security_mirror: "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version is version('10', '<=')) | ternary('http://security.debian.org/', 'http://security.debian.org/debian-security') }}"
apt_debian_contrib_nonfree_enable: false
apt_update: true
apt_update_cache_valid_time: 3600
apt_upgrade: true
apt_upgrade_type: dist
apt_upgrade_dpkg_options:
  - force-confdef
  - force-confold
apt_dpkg_configure: false
apt_clean: true
apt_autoremove: true
apt_install: []
apt_install_state: latest
apt_remove: []
apt_remove_purge: false
apt_etc_apt_apt_conf: []
apt_etc_apt_apt_conf_d_files_absent: []

docker:
  # Enable data-root migration (must be explicitly set to true)
  migrate_data_root: false

  # New data-root path
  data_root: "/var/lib/docker"

  # Old data-root path (migration source)
  old_data_root: "/var/lib/docker"

  # rsync options for data migration
  rsync_opts: "-aHAXxvP"

  # Remove old data after migration (recommended: false for manual cleanup)
  remove_old_data: false

# Additional daemon.json configuration (optional)
# Example:
#   docker_daemon_config:
#     storage-driver: "overlay2"
#     log-driver: "json-file"
#     log-opts:
#       max-size: "10m"
#       max-file: "3"
docker_daemon_config: {}

apt_apt_conf_file: /etc/apt/apt.conf
apt_debian_security_mirror_suffix: "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version is version('10', '<=')) | ternary('/updates', '-security') }}"

openlitespeed_dir: /usr/local/lsws
