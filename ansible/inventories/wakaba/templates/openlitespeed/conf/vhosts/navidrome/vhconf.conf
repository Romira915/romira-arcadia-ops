docRoot                   $VH_ROOT

index  {
  useServer               0
}

extprocessor navidrome_backend {
  type                    proxy
  address                 {{ navidrome_config.bind_address }}:{{ navidrome_config.port }}
  maxConns                1000
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
  persistConn             1
}

context /.well-known/acme-challenge/ {
  type                    static
  location                $VH_ROOT/.well-known/acme-challenge
  allowBrowse             1
  enableExpires           0
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 navidrome_backend
  allowBrowse             0
  addDefaultCharset       off
  enableIpGeo             0
  extraHeaders            <<<END_extraHeaders
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Host "{{ item.domains | first }}"
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
END_extraHeaders
}

rewrite  {
  enable                  1
  RewriteCond             %{REQUEST_URI} !^/\.well-known/
  RewriteCond             %{SERVER_PORT} 80
  RewriteRule             ^(.*)$ https://{{ item.domains | first }}/$1 [R=301,L]
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/{{ item.domains | first }}/privkey.pem
  certFile                /etc/letsencrypt/live/{{ item.domains | first }}/fullchain.pem
  certChain               1
}
