# vars for oci-tokyo-ampere

apt:
  package:
    - certbot
    - fail2ban
    - iptables-persistent
    - mariadb-server
    - nginx
    - openvpn
    - python3-certbot-nginx
    - rsync
    - valkey-server
    - xrdp
  install_state: present

iptables:
  allowed_ports:
    - port: 33999
      protocol: tcp
      comment: ssh
    - port: 80
      protocol: tcp
      comment: http
    - port: 443
      protocol: tcp
      comment: https
    - port: 36778
      protocol: tcp
    - port: 25565,25575
      protocol: tcp
      comment: For Minecraft
    - port: 62656
      protocol: tcp
      comment: For Minecraft Origin
  allowed_input_interfaces: []
  allowed_forward: []
  allowed_nat: []

nginx:
  config_file: nginx.conf
  conf_d_files:
    - mime.conf
    - newrelic.conf
  site_files:
    - api.hasu-music-quiz.aileafmura.com.conf
    - blog.romira.dev.conf
    - dev-site.romira.dev.conf
    - obsidian-sync.romira.dev
    - opencode.romira.dev.conf
    - vaultwarden.romira.dev.conf
  enabled_sites:
    - name: api.hasu-music-quiz.aileafmura.com.conf
      src: ../sites-available/api.hasu-music-quiz.aileafmura.com.conf
    - name: blog.romira.dev.conf
      src: ../sites-available/blog.romira.dev.conf
    - name: dev-site.romira.dev.conf
      src: ../sites-available/dev-site.romira.dev.conf
    - name: obsidian-sync.romira.dev
      src: /etc/nginx/sites-available/obsidian-sync.romira.dev
    - name: opencode.romira.dev.conf
      src: /etc/nginx/sites-available/opencode.romira.dev.conf
    - name: vaultwarden.romira.dev.conf
      src: ../sites-available/vaultwarden.romira.dev.conf

postgresql:
  databases:
    - name: blog_romira_dev
      owner: blog
    - name: comiketer
      owner: comiketer
  users:
    - name: blog
      password: "{{ vault_postgresql.blog_password }}"
      db: blog_romira_dev
    - name: comiketer

docker:
  migrate_data_root: true
  data_root: "/mnt/d/docker"
  old_data_root: "/var/lib/docker"
  remove_old_data: false

newrelic:
  infra:
    enabled: true
    enable_process_metrics: true
    status_server_enabled: true
    status_server_port: 18003
    custom_attributes:
      nr_deployed_by: ansible

openclaw:
  vault_access_uids:
    - '1000'
    - '10000'
  cron_shared_state_mcp:
    command: node
    args:
      - /home/node/.openclaw/shared-state-mcp/server.mjs
    supportsParallelToolCalls: true
    toolFilter:
      include:
        - groups_list
        - shared_state_get
        - shared_state_set

  tailscale_port: 8443
  proxy_enabled: true
  proxy_origins:
    - "https://ampere-instance.tail340994.ts.net:{{ openclaw.tailscale_port }}"

hermes:
  tailscale_port: 8444
  dashboard_public_url: "https://ampere-instance.tail340994.ts.net:{{ hermes.tailscale_port }}"
  project_dir: /opt/hermes
  data_root: /mnt/d/hermes/data
  config_source: /opt/romira-s-config/ai-config
  skills_mount_path: /opt/data/shared-skills
  workspace_path: /opt/data/workspace
  gog_home: /opt/data/home/.config/gogcli
  gog_binary: /opt/data/bin/gog
  gog_mcp_args:
    - mcp
    - --allow-write
    - --allow-gmail-send
  vault_path: /mnt/d/obsidian/vault
  personal_file_source: /mnt/d/openclaw/data/personal/personal.md
  user_uid: 10000
  dashboard_username: romira
  dashboard_host_port: 19119
  api_host_port: 18642
  tailscale_hostname: ampere-hermes
  tailscale_state_dir: /opt/hermes/tailscale
  exit_node: wakaba
  tailscale_image: docker.io/tailscale/tailscale:stable
  image: docker.io/nousresearch/hermes-agent:latest

deployment:
  inventory: oci-tokyo-ampere
tailscale:
  configure_router: false
  connect: true
  serve_routes:
    - port: "{{ openclaw.tailscale_port }}"
      target: http://127.0.0.1:18789
    - port: "{{ hermes.tailscale_port }}"
      target: http://127.0.0.1:19119
    - port: 8650
      target: http://127.0.0.1:18650
systemd_units:
  units:
    - name: blog-romira-dev-leptos.service
    - name: discord-bot-mgpf.service
    - name: hasu-music-quiz-backend.service
    - name: vaultwarden.service

# Docker data-root migration settings
app_layout:
  layouts:
    - name: hasu-music-quiz-backend
      path: /opt/hasu-music-quiz-backend
      owner: root
      group: root
      mode: "0755"
      directories:
        - path: bin
          owner: root
          group: root
          mode: "0755"
      required_files:
        - path: systemd_env
          managed: true
          owner: root
          group: root
          mode: "0600"
        - path: bin/hasu-music-quiz-backend
          managed: false

    - name: blog-romira-dev-leptos
      path: /usr/local/blog-romira-dev-leptos
      owner: ubuntu
      group: ubuntu
      mode: "0755"
      directories:
        - path: bin
          owner: ubuntu
          group: ubuntu
          mode: "0755"
      required_files:
        - path: systemd_env
          managed: false
        - path: bin/blog-romira-dev-server
          managed: false

    - name: vaultwarden
      path: /usr/local/vaultwarden
      owner: root
      group: root
      mode: "0755"
      directories:
        - path: vw-data
          owner: root
          group: root
          mode: "0755"
      required_files:
        - path: docker-compose.yml
          managed: false

    - name: obsidian-livesync
      path: /usr/local/obsidian-livesync
      owner: ubuntu
      group: ubuntu
      mode: "0755"
      required_files:
        - path: compose.yaml
          managed: false

