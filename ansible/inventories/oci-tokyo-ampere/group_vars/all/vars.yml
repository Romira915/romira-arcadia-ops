# vars for oci-tokyo-ampere

apt:
  package:
    - certbot
    - fail2ban
    - iptables-persistent
    - mariadb-server
    - nginx
    - openvpn
    - python3-certbot-nginx
    - rsync
    - valkey-server
    - xrdp
  install_state: present

iptables:
  allowed_ports:
    - port: 33999
      protocol: tcp
      comment: ssh
    - port: 80
      protocol: tcp
      comment: http
    - port: 443
      protocol: tcp
      comment: https
    - port: 36778
      protocol: tcp
    - port: 25565,25575
      protocol: tcp
      comment: For Minecraft
    - port: 62656
      protocol: tcp
      comment: For Minecraft Origin
  allowed_input_interfaces: []
  allowed_forward: []
  allowed_nat: []

nginx:
  config_file: nginx.conf
  conf_d_files:
    - mime.conf
    - newrelic.conf
  site_files:
    - blog.romira.dev.conf
    - dev-site.romira.dev.conf
    - obsidian-sync.romira.dev
    - vaultwarden.romira.dev.conf
  site_templates:
    - hasu-music-quiz-api.conf
    - hermes-pages.conf
  enabled_sites:
    - name: hasu-music-quiz-api.conf
      src: ../sites-available/hasu-music-quiz-api.conf
    - name: blog.romira.dev.conf
      src: ../sites-available/blog.romira.dev.conf
    - name: dev-site.romira.dev.conf
      src: ../sites-available/dev-site.romira.dev.conf
    - name: obsidian-sync.romira.dev
      src: /etc/nginx/sites-available/obsidian-sync.romira.dev
    - name: vaultwarden.romira.dev.conf
      src: ../sites-available/vaultwarden.romira.dev.conf
    - name: hermes-pages.conf
      src: ../sites-available/hermes-pages.conf

postgresql:
  databases:
    - name: blog_romira_dev
      owner: blog
    - name: comiketer
      owner: comiketer
  users:
    - name: blog
      password: "{{ vault_postgresql.blog_password }}"
      db: blog_romira_dev
    - name: comiketer

docker:
  migrate_data_root: true
  data_root: "/mnt/d/docker"
  old_data_root: "/var/lib/docker"
  remove_old_data: false

newrelic:
  infra:
    enabled: true
    enable_process_metrics: true
    status_server_enabled: true
    status_server_port: 18003
    custom_attributes:
      nr_deployed_by: ansible

openclaw:
  vault_access_uids:
    - '1000'
    - '10000'
  cron_shared_state_mcp:
    command: node
    args:
      - /home/node/.openclaw/shared-state-mcp/server.mjs
    supportsParallelToolCalls: true
    toolFilter:
      include:
        - groups_list
        - shared_state_get
        - shared_state_set

  tailscale_port: 8443
  proxy_enabled: true
  proxy_origins:
    - "https://ampere-instance.tail340994.ts.net:{{ openclaw.tailscale_port }}"

hermes:
  tailscale_port: 8444
  dashboard_public_url: "https://ampere-instance.tail340994.ts.net:{{ hermes.tailscale_port }}"
  # Pages that Hermes publishes with hermes-pages. nginx, Tailscale Serve and the CLI all read these values.
  html:
    host_root: /var/www/hermes
    container_root: /opt/data/workspace/html
    public_server_name: hermes.romira.dev
    public_base_url: "https://{{ hermes.html.public_server_name }}/"
    private_tailscale_port: 8445
    private_listen_port: 18445
    private_base_url: "https://ampere-instance.tail340994.ts.net:{{ hermes.html.private_tailscale_port }}/"
  project_dir: /opt/hermes
  data_root: /mnt/d/hermes/data
  config_source: /opt/romira-s-config/ai-config
  skills_mount_path: /opt/data/shared-skills
  workspace_path: /opt/data/workspace
  gog_home: /opt/data/home/.config/gogcli
  gog_binary: /opt/data/bin/gog
  gh:
    version: 2.103.3
    sha256: ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63
    binary: /opt/data/bin/gh
    config_dir: /opt/data/home/.config/gh
  # Why 4500 for the user profile: 3000 was full of standing instructions and left no room for new ones.
  memory_limits:
    memory_char_limit: 6000
    user_char_limit: 4500
  terminal_env_passthrough:
    - GOG_HOME
    - GOG_KEYRING_BACKEND
    - GOG_KEYRING_PASSWORD
    - GH_CONFIG_DIR
    - GIT_CONFIG_COUNT
    - GIT_CONFIG_KEY_0
    - GIT_CONFIG_VALUE_0
  # Why Sakura AI Engine: a domestic OpenAI-compatible endpoint with a monthly free tier, kept beside
  # the Claude subscription so a session can switch to it with `/model custom:sakura:<model>`.
  providers:
    sakura:
      base_url: https://api.ai.sakura.ad.jp/v1
      key_env: SAKURA_AI_ENGINE_API_KEY
      api_mode: chat_completions
      default_model: gpt-oss-120b
      # Why a fixed list: the GUI pickers list only configured models, while /v1/models also returns
      # embedding, speech and chat models whose endpoints reject tool calls, which Hermes needs. Live
      # discovery would also write its catalog back here and make every role run rewrite the entry.
      discover_models: false
      models:
        - gpt-oss-120b
        - preview/Kimi-K2.7-Code
        - preview/GLM-5.3-Flash
        - preview/DeepSeek-V4.1-Flash-1017
        - preview/Qwen3.6-35B-A3B
        - preview/gemma-4-31B-it
  gog_mcp_args:
    - mcp
    - --allow-write
    - --allow-gmail-send
  vault_path: /mnt/d/obsidian/vault
  personal_file_source: /mnt/d/openclaw/data/personal/personal.md
  user_uid: 10000
  dashboard_username: romira
  dashboard_host_port: 19119
  api_host_port: 18642
  tailscale_hostname: ampere-hermes
  tailscale_state_dir: /opt/hermes/tailscale
  exit_node: wakaba
  tailscale_image: docker.io/tailscale/tailscale:stable
  # Built from Romira915/hermes-agent-image and pinned by tag and digest. The image repository's CI opens
  # the pull request that changes it; after the merge, hermes-image-apply on the host replaces the image.
  image: ghcr.io/romira915/hermes-agent-image:v0.23.1-r3@sha256:1aae421061920aeb756b45c706a89da1ff923a9ba7e0de3396a14857ab0c6b5d
  # Files the host checks in a new image before and after replacing it. Change them in the same pull
  # request as the image when the stop-gate patches change. Keep the digests quoted: YAML would read a
  # digest made only of digits (or digits and one "e") as a number, and the host would refuse it.
  image_verify:
    /opt/hermes/agent/turn_stop_gates.py: "9bf4cb1e512b7bbea2289c8d4b4171a60fb2d509b84f821f06a35aa4efc2cd11"
    /opt/hermes/agent/factgate.py: "85a1ac17d534f801eaa14640341d7c4ec75aee22e45ca232331695712dc87141"
    /opt/hermes/agent/formatgate.py: "35ee0e4309a0da75b1a76f04051407dfdec9d0d84012345a50fe643643989cfc"
    /opt/hermes/agent/replygate.py: "786499fc083b78837fb9d8a9811001c2047723dd5e4f420c9e3d33c10c972f83"
    /opt/hermes/agent/turn_failure_copy.py: "8e406b258cd633e610a1f0dc856a5cdb4da7aab70183e30808766549ff685972"
  image_apply:
    source_url: https://api.github.com/repos/Romira915/romira-arcadia-ops/contents/ansible/inventories/oci-tokyo-ampere/group_vars/all/vars.yml?ref=main
    # Why 05:00-06:45 JST: Hermes' maintenance jobs run at 03:00, vaultwarden's backup at 04:00-04:30,
    # and the morning notification jobs from 07:05, so a replacement interrupts none of them.
    on_calendar: "*-*-* 05,06:00/15:00"
    health_timeout_seconds: 300
  registry:
    url: ghcr.io
    username: Romira915

deployment:
  inventory: oci-tokyo-ampere
tailscale:
  configure_router: false
  connect: true
  serve_routes:
    - port: "{{ openclaw.tailscale_port }}"
      target: http://127.0.0.1:18789
    - port: "{{ hermes.tailscale_port }}"
      target: http://127.0.0.1:19119
    - port: 8650
      target: http://127.0.0.1:18650
    - port: "{{ hermes.html.private_tailscale_port }}"
      target: "http://127.0.0.1:{{ hermes.html.private_listen_port }}"
systemd_units:
  units:
    - name: blog-romira-dev-leptos.service
    - name: discord-bot-mgpf.service
    - name: hasu-music-quiz-backend.service
    - name: vaultwarden.service

# Docker data-root migration settings
app_layout:
  layouts:
    - name: hasu-music-quiz-backend
      path: /opt/hasu-music-quiz-backend
      owner: root
      group: root
      mode: "0755"
      directories:
        - path: bin
          owner: ubuntu
          group: ubuntu
          mode: "0755"
      required_files:
        - path: systemd_env
          managed: true
          template: true
          owner: root
          group: root
          mode: "0600"
        - path: bin/hasu-music-quiz-backend
          managed: false

    - name: blog-romira-dev-leptos
      path: /usr/local/blog-romira-dev-leptos
      owner: ubuntu
      group: ubuntu
      mode: "0755"
      directories:
        - path: bin
          owner: ubuntu
          group: ubuntu
          mode: "0755"
      required_files:
        - path: systemd_env
          managed: false
        - path: bin/blog-romira-dev-server
          managed: false

    - name: vaultwarden
      path: /usr/local/vaultwarden
      owner: root
      group: root
      mode: "0755"
      directories:
        - path: vw-data
          owner: root
          group: root
          mode: "0755"
      required_files:
        - path: docker-compose.yml
          managed: false

    - name: obsidian-livesync
      path: /usr/local/obsidian-livesync
      owner: ubuntu
      group: ubuntu
      mode: "0755"
      required_files:
        - path: compose.yaml
          managed: false

