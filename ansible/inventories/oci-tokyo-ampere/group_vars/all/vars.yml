---
# vars for oci-tokyo-ampere

target_inventory: oci-tokyo-ampere

tailscale_configure_router: false
tailscale_connect: true
openclaw_tailscale_port: 8443
hermes_tailscale_port: 8444
hermes_dashboard_public_url: "https://ampere-instance.tail340994.ts.net:{{ hermes_tailscale_port }}"
tailscale_serve_routes:
  - port: "{{ openclaw_tailscale_port }}"
    target: http://127.0.0.1:18789
  - port: "{{ hermes_tailscale_port }}"
    target: http://127.0.0.1:19119
openclaw_proxy_enabled: true
openclaw_proxy_origins:
  - "https://ampere-instance.tail340994.ts.net:{{ openclaw_tailscale_port }}"

apt:
  package:
    - certbot
    - fail2ban
    - iptables-persistent
    - mariadb-server
    - nginx
    - openvpn
    - python3-certbot-nginx
    - rsync
    - valkey-server
    - xrdp
  install_state: present

iptables:
  allowed_ports:
    - port: 33999
      protocol: tcp
      comment: ssh
    - port: 80
      protocol: tcp
      comment: http
    - port: 443
      protocol: tcp
      comment: https
    - port: 36778
      protocol: tcp
    - port: 25565,25575
      protocol: tcp
      comment: For Minecraft
    - port: 62656
      protocol: tcp
      comment: For Minecraft Origin
  allowed_input_interfaces: []
  allowed_forward: []
  allowed_nat: []

nginx:
  config_file: nginx.conf
  conf_d_files:
    - mime.conf
    - newrelic.conf
  site_files:
    - api.hasu-music-quiz.aileafmura.com.conf
    - blog.romira.dev.conf
    - dev-site.romira.dev.conf
    - obsidian-sync.romira.dev
    - opencode.romira.dev.conf
    - vaultwarden.romira.dev.conf
  enabled_sites:
    - name: api.hasu-music-quiz.aileafmura.com.conf
      src: ../sites-available/api.hasu-music-quiz.aileafmura.com.conf
    - name: blog.romira.dev.conf
      src: ../sites-available/blog.romira.dev.conf
    - name: dev-site.romira.dev.conf
      src: ../sites-available/dev-site.romira.dev.conf
    - name: obsidian-sync.romira.dev
      src: /etc/nginx/sites-available/obsidian-sync.romira.dev
    - name: opencode.romira.dev.conf
      src: /etc/nginx/sites-available/opencode.romira.dev.conf
    - name: vaultwarden.romira.dev.conf
      src: ../sites-available/vaultwarden.romira.dev.conf

postgresql:
  databases:
    - name: blog_romira_dev
      owner: blog
    - name: comiketer
      owner: comiketer
  users:
    - name: blog
      password: "{{ vault_postgresql_blog_password }}"
      db: blog_romira_dev
    - name: comiketer

systemd_units:
  - name: blog-romira-dev-leptos.service
  - name: discord-bot-mgpf.service
  - name: hasu-music-quiz-backend.service
  - name: vaultwarden.service

# Docker data-root migration settings
docker:
  migrate_data_root: true
  data_root: "/mnt/d/docker"
  old_data_root: "/var/lib/docker"
  remove_old_data: false

app_layouts:
  - name: hasu-music-quiz-backend
    path: /opt/hasu-music-quiz-backend
    owner: root
    group: root
    mode: "0755"
    directories:
      - path: bin
        owner: root
        group: root
        mode: "0755"
    required_files:
      - path: systemd_env
        managed: true
        owner: root
        group: root
        mode: "0600"
      - path: bin/hasu-music-quiz-backend
        managed: false

  - name: blog-romira-dev-leptos
    path: /usr/local/blog-romira-dev-leptos
    owner: ubuntu
    group: ubuntu
    mode: "0755"
    directories:
      - path: bin
        owner: ubuntu
        group: ubuntu
        mode: "0755"
    required_files:
      - path: systemd_env
        managed: false
      - path: bin/blog-romira-dev-server
        managed: false

  - name: vaultwarden
    path: /usr/local/vaultwarden
    owner: root
    group: root
    mode: "0755"
    directories:
      - path: vw-data
        owner: root
        group: root
        mode: "0755"
    required_files:
      - path: docker-compose.yml
        managed: false

  - name: obsidian-livesync
    path: /usr/local/obsidian-livesync
    owner: ubuntu
    group: ubuntu
    mode: "0755"
    required_files:
      - path: compose.yaml
        managed: false

newrelic:
  infra:
    enabled: true
    enable_process_metrics: true
    status_server_enabled: true
    status_server_port: 18003
    custom_attributes:
      nr_deployed_by: ansible

# Inventory-owned role settings.
app_layout_enforce_required_files: true
app_layout_src_dir: "{{ playbook_dir }}/inventories/{{ target_inventory }}/files/app_layout"

apt_manage_sources_list: false
apt_src_enable: true
apt_backports_enable: true

# Ubuntu specific
apt_ubuntu_mirror: mirror://mirrors.ubuntu.com/mirrors.txt
apt_ubuntu_security_mirror: http://security.ubuntu.com/ubuntu
apt_ubuntu_universe_enable: true
apt_ubuntu_multiverse_enable: true
apt_ubuntu_backports_enable: true
apt_ubuntu_partner_enable: false
apt_ubuntu_extras_enable: false
# Debian specific
apt_debian_mirror: http://deb.debian.org/debian/
apt_debian_security_mirror: "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version is version('10', '<=')) | ternary('http://security.debian.org/', 'http://security.debian.org/debian-security') }}"
apt_debian_contrib_nonfree_enable: false
apt_update: true
apt_update_cache_valid_time: 3600
apt_upgrade: true
apt_upgrade_type: dist
apt_upgrade_dpkg_options:
  - force-confdef
  - force-confold
apt_dpkg_configure: false
apt_clean: true
apt_autoremove: true
apt_install: []
apt_install_state: latest
apt_remove: []
apt_remove_purge: false
apt_etc_apt_apt_conf: []
apt_etc_apt_apt_conf_d_files_absent: []

docker_daemon_config: {}

nginx_package: nginx
nginx_service: nginx.service
nginx_src_dir: "{{ playbook_dir }}/inventories/{{ target_inventory }}/files/nginx"

openclaw_project_dir: /opt/openclaw
openclaw_data_root: /mnt/d/openclaw/data
openclaw_config_repo: https://github.com/Romira915/romira-s-config.git
openclaw_config_dir: /opt/romira-s-config
openclaw_config_version: master
openclaw_config_owner: ubuntu
openclaw_vault_path: /mnt/d/obsidian/vault
openclaw_chamber_dir: /opt/opencode-obsidian-stack
openclaw_livesync_data: /mnt/d/obsidian/livesync
openclaw_livesync_image: ghcr.io/vrtmrz/livesync-cli:1.0.42-cli@sha256:0044b787488a3479fa23a22e27e203f7f689ee6b0d7025a9169c7e3de87d0620
openclaw_image: localhost/openclaw:2026.10.9-codex-apps-v18
openclaw_vault_access_uids:
  - '1000'
  - '10000'
openclaw_cron_shared_state_mcp:
  command: node
  args:
    - /home/node/.openclaw/shared-state-mcp/server.mjs
  supportsParallelToolCalls: true
  toolFilter:
    include:
      - groups_list
      - shared_state_get
      - shared_state_set

hermes_project_dir: /opt/hermes
hermes_data_root: /mnt/d/hermes/data
hermes_config_source: /opt/romira-s-config/ai-config
hermes_skills_mount_path: /opt/data/shared-skills
hermes_workspace_path: /opt/data/workspace
hermes_gog_home: /opt/data/home/.config/gogcli
hermes_gog_binary: /opt/data/bin/gog
hermes_gog_mcp_args:
  - mcp
  - --allow-write
  - --allow-gmail-send
hermes_vault_path: /mnt/d/obsidian/vault
hermes_personal_file_source: /mnt/d/openclaw/data/personal/personal.md
hermes_user_uid: 10000
hermes_dashboard_username: romira
hermes_dashboard_host_port: 19119
hermes_api_host_port: 18642
hermes_image: docker.io/nousresearch/hermes-agent:latest@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d

systemd_units_src_dir: "{{ playbook_dir }}/inventories/{{ target_inventory }}/files/systemd"

apt_apt_conf_file: /etc/apt/apt.conf
apt_debian_security_mirror_suffix: "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version is version('10', '<=')) | ternary('/updates', '-security') }}"

vault_newrelic_license_key: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  39383965306137323061393966353931613931373434623531336539313535663831343766373830
  6338343461336433633437323531303665616435316366630a653765386133323861333164633162
  61306166353137393663646161353465363134666235613766656133356265643932646235643032
  3333633761373739380a306463323666313762373263613034663665383834623565376530386633
  36633066643465346335636538383834656532623230643331376665366261366364356235646638
  3738303562323630373737656337396162336431366234376165
