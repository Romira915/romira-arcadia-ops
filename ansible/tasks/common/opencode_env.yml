---
# Place OpenCode env files (Google OAuth and Maps credentials) using the
# platform-specific file modules. Secrets are pulled from Ansible Vault.
- name: Include POSIX OpenCode env tasks
  ansible.builtin.include_tasks:
    file: opencode_env_posix.yml
  when: (ansible_os_family | default("")) != "Windows"

- name: Include Windows OpenCode env tasks
  ansible.builtin.include_tasks:
    file: opencode_env_windows.yml
  when: (ansible_os_family | default("")) == "Windows"
