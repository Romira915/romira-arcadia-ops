---
- name: Ensure OpenCode env directory exists
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "0700"
  loop: "{{ opencode.env_files | default([]) }}"
  loop_control:
    label: "{{ item.dest | dirname }}"
  no_log: true
  when: opencode.env_files is defined

- name: Place OpenCode env files
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "0600"
  loop: "{{ opencode.env_files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
  when: opencode.env_files is defined
