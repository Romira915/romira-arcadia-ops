---
# tasks file for Tailscale
- name: Inspect the Tailscale signing key
  ansible.builtin.stat:
    path: /usr/share/keyrings/tailscale-archive-keyring.gpg
  register: tailscale_signing_key
  tags:
    - tailscale

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  become: true
  when: not ansible_check_mode or not tailscale_signing_key.stat.exists
  tags:
    - tailscale

- name: Inspect the Tailscale apt repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/tailscale.list
  register: tailscale_repository
  tags:
    - tailscale

- name: Add Tailscale repository
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: '0644'
  become: true
  when: not ansible_check_mode or not tailscale_repository.stat.exists
  tags:
    - tailscale

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags:
    - tailscale
    - apt

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
  become: true
  when: not ansible_check_mode
  tags:
    - tailscale

- name: Connect Tailscale and configure Serve routes
  ansible.builtin.import_tasks: connect.yml
  when: tailscale_connect and not ansible_check_mode
  tags:
    - tailscale

- name: Ensure net.ipv4.ip_forward enabled
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  become: true
  when: tailscale_configure_router
  tags:
    - tailscale
    - sysctl

- name: Ensure Ensure net.ipv6.conf.all.forwarding enabled
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  become: true
  when: tailscale_configure_router
  tags:
    - tailscale
    - sysctl

- name: Detect active network device for internet access
  command: ip -o route get 8.8.8.8
  register: route_info
  when: tailscale_configure_router and not ansible_check_mode
  tags:
    - tailscale

- name: Extract network device name
  set_fact:
    netdev: "{{ route_info.stdout.split()[4] }}"
  when: tailscale_configure_router and not ansible_check_mode
  tags:
    - tailscale

- name: Apply ethtool settings for the detected device
  command: ethtool -K {{ netdev }} rx-udp-gro-forwarding on rx-gro-list off
  become: true
  when: tailscale_configure_router and not ansible_check_mode
  tags:
    - tailscale

- name: Create persistence script for ethtool settings
  copy:
    dest: /etc/networkd-dispatcher/routable.d/50-tailscale
    content: |
      #!/bin/sh
      ethtool -K {{ netdev }} rx-udp-gro-forwarding on rx-gro-list off
    owner: root
    group: root
    mode: "0755"
  become: true
  when: tailscale_configure_router and not ansible_check_mode
  tags:
    - tailscale
