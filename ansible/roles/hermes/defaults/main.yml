---
# Default Hermes configuration; inventory overrides stay under the hermes dictionary.
hermes:  # noqa: var-naming[no-role-prefix]
  tailscale_port: 8444
  dashboard_public_url: "https://ampere-instance.tail340994.ts.net:{{ hermes.tailscale_port }}"
  project_dir: /opt/hermes
  data_root: /mnt/d/hermes/data
  config_source: /opt/romira-s-config/ai-config
  skills_mount_path: /opt/data/shared-skills
  workspace_path: /opt/data/workspace
  gog_home: /opt/data/home/.config/gogcli
  gog_binary: /opt/data/bin/gog
  # Why /opt/data/bin and not the image: gh is a standalone binary, and the image tag stays tied to
  # upstream and stop-gate changes, so a gh upgrade does not need a new image release.
  gh:
    version: 2.103.3
    sha256: ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63
    binary: /opt/data/bin/gh
  # Environment variables that Hermes passes from .env into its terminal sessions.
  terminal_env_passthrough:
    - GOG_HOME
    - GOG_KEYRING_BACKEND
    - GOG_KEYRING_PASSWORD
    - GH_TOKEN
    - GIT_CONFIG_COUNT
    - GIT_CONFIG_KEY_0
    - GIT_CONFIG_VALUE_0
  gog_mcp_args:
    - mcp
    - --allow-write
    - --allow-gmail-send
  vault_path: /mnt/d/obsidian/vault
  personal_file_source: /mnt/d/openclaw/data/personal/personal.md
  user_uid: 10000
  dashboard_username: romira
  dashboard_host_port: 19119
  api_host_port: 18642
  tailscale_hostname: ampere-hermes
  tailscale_state_dir: /opt/hermes/tailscale
  exit_node: wakaba
  tailscale_image: docker.io/tailscale/tailscale:stable
  # Built from Romira915/hermes-agent-image; pinned by tag and digest, updated only by this role.
  image: ghcr.io/romira915/hermes-agent-image:v0.23.0-r1@sha256:9c1dfc66ef56c36afdbcbe2cbbe7c8f240414a611d801a2cea5ba6ec15e2ea08
  registry:
    url: ghcr.io
    username: Romira915
