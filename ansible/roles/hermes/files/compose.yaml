name: hermes

services:
  hermes:
    image: hermes-agent-sudo:arm64
    build:
      context: ./image
      dockerfile: Dockerfile
      args:
        HERMES_BASE_IMAGE: ${HERMES_IMAGE:?set HERMES_IMAGE in .env}
    platform: linux/arm64
    container_name: hermes-agent
    # Why a shared network namespace: only Hermes' outbound traffic follows the sidecar's exit node,
    # leaving the host's Tailscale, OpenClaw and every other host service untouched.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
    restart: unless-stopped
    working_dir: /opt/data/workspace
    command: [gateway, run]
    env_file:
      - ./.env
    environment:
      PATH: /opt/data/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      TZ: Asia/Tokyo
    volumes:
      - type: bind
        source: ${HERMES_DATA_ROOT:?set HERMES_DATA_ROOT in .env}
        target: /opt/data
        bind:
          create_host_path: false
      - type: bind
        source: ${ROMIRA_AI_CONFIG_SOURCE:?set ROMIRA_AI_CONFIG_SOURCE in .env}/skills
        target: /opt/data/shared-skills
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ROMIRA_AI_CONFIG_SOURCE:?set ROMIRA_AI_CONFIG_SOURCE in .env}
        target: /opt/data/shared-config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PERSONAL_FILE_SOURCE:?set PERSONAL_FILE_SOURCE in .env}
        target: /opt/data/.claude/personal.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OBSIDIAN_VAULT_SOURCE:?set OBSIDIAN_VAULT_SOURCE in .env}
        target: /opt/data/workspace/obsidian-vault
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /mnt
        target: /mnt
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    shm_size: 1gb
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 2m

  tailscale:
    image: ${HERMES_TAILSCALE_IMAGE:?set HERMES_TAILSCALE_IMAGE in .env}
    container_name: hermes-tailscale
    hostname: ${HERMES_TAILSCALE_HOSTNAME:?set HERMES_TAILSCALE_HOSTNAME in .env}
    networks:
      - default
      - openclaw
    # Why public resolvers: Docker's embedded DNS queries its upstream from this namespace, so while
    # the exit node is active an upstream such as OCI's 169.254.169.254 would be unreachable.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      # Why no auth key: the node logs in once interactively and the persisted state keeps it signed in.
      TS_HOSTNAME: ${HERMES_TAILSCALE_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      # Why no DNS takeover: MagicDNS would rewrite resolv.conf and bypass Docker's service names.
      TS_ACCEPT_DNS: "false"
      # Why: the watchdog persists exit-node settings; containerboot's `tailscale up` refuses to run
      # over them after a recreate. Only log in when the node is not yet authenticated.
      TS_AUTH_ONCE: "true"
      # Why no exit node here: the watchdog is the single owner of exit-node state, so a restart
      # never blackholes traffic while wakaba is asleep.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:18642:8642"
      - "127.0.0.1:19119:9119"
      # Why loopback only: the host's Tailscale Serve is the sole tailnet entrance to the Muse bridge.
      - "127.0.0.1:18650:8650"
    volumes:
      - type: bind
        source: ${HERMES_TAILSCALE_STATE_DIR:?set HERMES_TAILSCALE_STATE_DIR in .env}
        target: /var/lib/tailscale
        bind:
          create_host_path: false
      - tailscale-socket:/var/run/tailscale
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  muse-bridge:
    image: hermes-agent-sudo:arm64
    container_name: hermes-muse-bridge
    # Why a separate container: it holds only the bridge token and the Hermes API key, not the rest
    # of .env or the data directory, and cannot gain privileges. It forwards Muse's questions to the
    # real Hermes over the API, so Muse gets the same memory, skills and tools as the user.
    # Why the Tailscale network namespace: the host's published port and Serve reach it there, and
    # Hermes' API listens on this namespace's loopback.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      hermes:
        condition: service_healthy
    user: "10000:10000"
    entrypoint: [/opt/hermes/.venv/bin/python3, /app/muse_mcp_bridge.py]
    environment:
      HERMES_MUSE_MCP_HOST: 0.0.0.0
      HERMES_MUSE_MCP_PORT: "8650"
      HERMES_MUSE_MCP_TOKEN_FILE: /run/muse/token
      API_SERVER_KEY: ${API_SERVER_KEY:?set API_SERVER_KEY in .env}
      TZ: Asia/Tokyo
    volumes:
      - type: bind
        source: ${HERMES_DATA_ROOT:?set HERMES_DATA_ROOT in .env}/muse-bridge
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_DATA_ROOT:?set HERMES_DATA_ROOT in .env}/secrets/muse-mcp.token
        target: /run/muse/token
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  exit-node-watchdog:
    image: ${HERMES_TAILSCALE_IMAGE:?set HERMES_TAILSCALE_IMAGE in .env}
    container_name: hermes-exit-node-watchdog
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
    entrypoint: [/bin/sh, /watchdog.sh]
    environment:
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      HERMES_EXIT_NODE: ${HERMES_EXIT_NODE:?set HERMES_EXIT_NODE in .env}
    volumes:
      - type: bind
        source: ./exit-node-watchdog.sh
        target: /watchdog.sh
        read_only: true
        bind:
          create_host_path: false
      - tailscale-socket:/var/run/tailscale
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tailscale-socket:

networks:
  openclaw:
    external: true
    name: openclaw_default
