openclaw_defaults: # noqa: var-naming[no-role-prefix]
  vault_access_uids:
    - '1000'
    - '10000'
  cron_shared_state_mcp:
    command: node
    args:
      - /home/node/.openclaw/shared-state-mcp/server.mjs
    supportsParallelToolCalls: true
    toolFilter:
      include:
        - groups_list
        - shared_state_get
        - shared_state_set
  project_dir: /opt/openclaw
  proxy_enabled: false
  proxy_origins: []
  data_root: /mnt/d/openclaw/data
  config_repo: https://github.com/Romira915/romira-s-config.git
  config_dir: /opt/romira-s-config
  config_version: master
  config_owner: ubuntu
  vault_path: /mnt/d/obsidian/vault
  chamber_dir: /opt/opencode-obsidian-stack
  livesync_data: /mnt/d/obsidian/livesync
  livesync_image: ghcr.io/vrtmrz/livesync-cli:1.0.42-cli@sha256:0044b787488a3479fa23a22e27e203f7f689ee6b0d7025a9169c7e3de87d0620
  image: localhost/openclaw:2026.10.9-codex-apps-v18
openclaw: {} # noqa: var-naming[no-role-prefix]
