---
- name: Inspect OpenChamber environment
  ansible.builtin.slurp:
    src: "{{ openclaw_chamber_dir }}/.env"
  become: true
  register: openclaw_chamber_env
  no_log: true

- name: Identify the currently configured Vault
  ansible.builtin.set_fact:
    openclaw_chamber_vault: "{{ ((openclaw_chamber_env.content | b64decode) | regex_findall('(?m)^VAULT_PATH=(.*)$') | first) | default('') }}"
  no_log: true

- name: Validate the current Vault configuration
  ansible.builtin.assert:
    that:
      - openclaw_chamber_vault == openclaw_vault_path
    fail_msg: OpenChamber is not configured to use the managed Vault path.

- name: Ensure OpenClaw directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  become: true
  loop:
    - {path: "{{ openclaw_project_dir }}", owner: ubuntu, group: ubuntu, mode: '0700'}
    - {path: "{{ openclaw_data_root }}/state", owner: '1000', group: '1000', mode: '0700'}
    - {path: "{{ openclaw_data_root }}/auth", owner: '1000', group: '1000', mode: '0700'}
    - {path: "{{ openclaw_data_root }}/personal", owner: '1000', group: '1000', mode: '0700'}

- name: Ensure the Hermes MCP bridge directory exists
  ansible.builtin.file:
    path: "{{ openclaw_data_root }}/state/hermes-mcp-bridge"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0700'
  become: true

- name: Ensure OpenClaw and Hermes share one Cron state database
  ansible.builtin.file:
    path: "{{ openclaw_data_root }}/state/shared-state"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0700'
  become: true

- name: Install the limited-scope Hermes Android and shared-state MCP bridge
  ansible.builtin.copy:
    src: hermes-mcp-bridge/server.mjs
    dest: "{{ openclaw_data_root }}/state/hermes-mcp-bridge/server.mjs"
    owner: '1000'
    group: '1000'
    mode: '0500'
  become: true

- name: Require the private Hermes MCP bridge token
  ansible.builtin.assert:
    that:
      - vault_hermes_openclaw_mcp_token is defined
      - vault_hermes_openclaw_mcp_token | length >= 32
    fail_msg: The encrypted Hermes to OpenClaw MCP bridge token is missing or too short.
  no_log: true

- name: Ensure Cron shared-state MCP directory exists
  ansible.builtin.file:
    path: "{{ openclaw_data_root }}/state/shared-state-mcp"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0700'
  become: true

- name: Install the Cron shared-state MCP server in persistent state
  ansible.builtin.copy:
    src: shared-state-mcp/server.mjs
    dest: "{{ openclaw_data_root }}/state/shared-state-mcp/server.mjs"
    owner: '1000'
    group: '1000'
    mode: '0500'
  become: true

- name: Create the private personal file if absent
  ansible.builtin.copy:
    content: ''
    dest: "{{ openclaw_data_root }}/personal/personal.md"
    owner: '1000'
    group: '1000'
    mode: '0600'
    force: false
  become: true
  no_log: true

- name: Grant OpenClaw and Hermes write access to the shared Vault
  ansible.builtin.include_tasks: vault-access.yml

- name: Clone or update the personal configuration repository
  ansible.builtin.git:
    repo: "{{ openclaw_config_repo }}"
    dest: "{{ openclaw_config_dir }}"
    version: "{{ openclaw_config_version }}"
    force: false
  become: true
  become_user: "{{ openclaw_config_owner }}"

- name: Deploy the Codex app authority image build context
  ansible.builtin.copy:
    src: codex-apps-patch/
    dest: "{{ openclaw_project_dir }}/codex-apps-patch/"
    owner: ubuntu
    group: ubuntu
    mode: '0644'
    directory_mode: '0755'
  become: true
  register: openclaw_codex_patch_context

- name: Check whether the Codex app authority image exists
  ansible.builtin.command:
    argv: [docker, image, inspect, "{{ openclaw_image }}"]
  become: true
  register: openclaw_codex_patch_image
  changed_when: false
  failed_when: false

- name: Build the OpenClaw image with generic Codex app authority
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --pull
      - --tag
      - "{{ openclaw_image }}"
      - "{{ openclaw_project_dir }}/codex-apps-patch"
  become: true
  when:
    - not ansible_check_mode
    - openclaw_codex_patch_context.changed or openclaw_codex_patch_image.rc != 0
  register: openclaw_codex_patch_build
  changed_when: true

- name: Inspect the OpenClaw environment file
  ansible.builtin.stat:
    path: "{{ openclaw_project_dir }}/.env"
  become: true
  register: openclaw_env_files
  no_log: true

- name: Create a Gateway token for a fresh installation
  ansible.builtin.copy:
    content: "OPENCLAW_GATEWAY_TOKEN={{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}\n"
    dest: "{{ openclaw_project_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    force: false
  become: true
  no_log: true
  when:
    - not openclaw_env_files.stat.exists

- name: Configure OpenClaw host paths and image
  ansible.builtin.lineinfile:
    path: "{{ openclaw_project_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    mode: '0600'
  become: true
  no_log: true
  loop:
    - {key: OPENCLAW_IMAGE, value: "{{ openclaw_image }}"}
    - {key: OPENCLAW_DATA_ROOT, value: "{{ openclaw_data_root }}"}
    - {key: ROMIRA_AI_CONFIG_SOURCE, value: "{{ openclaw_config_dir }}/ai-config"}
    - {key: OBSIDIAN_VAULT_SOURCE, value: "{{ openclaw_vault_path }}"}
  when: not ansible_check_mode or openclaw_env_files.stat.exists

- name: Deploy the private Hermes MCP bridge credential
  ansible.builtin.copy:
    content: "HERMES_OPENCLAW_MCP_TOKEN={{ vault_hermes_openclaw_mcp_token }}\n"
    dest: "{{ openclaw_project_dir }}/hermes-bridge.env"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  become: true
  no_log: true

- name: Deploy OpenClaw Compose
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ openclaw_project_dir }}/compose.yaml"
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  become: true

- name: Configure the shared Vault and LiveSync service
  ansible.builtin.include_tasks: vault.yml

- name: Configure the shared skill directory
  ansible.builtin.include_tasks: skills.yml

- name: Start and verify the Gateway using the new configuration
  when: not ansible_check_mode
  block:
    - name: Start the OpenClaw Gateway
      community.docker.docker_compose_v2:
        project_src: "{{ openclaw_project_dir }}"
        project_name: openclaw
        env_files:
          - .env
        services:
          - openclaw-gateway
          - hermes-mcp-bridge
        state: present
        pull: missing
        recreate: auto
      become: true

    - name: Wait for the Gateway to become healthy
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{{ '{{' }}.State.Health.Status{{ '}}' }}", openclaw-openclaw-gateway-1]
      become: true
      register: openclaw_gateway_health
      changed_when: false
      retries: 60
      delay: 5
      until: openclaw_gateway_health.stdout == 'healthy'

    - name: Wait for the Hermes MCP bridge to become healthy
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{{ '{{' }}.State.Health.Status{{ '}}' }}", openclaw-hermes-mcp-bridge-1]
      become: true
      register: openclaw_hermes_bridge_health
      changed_when: false
      retries: 30
      delay: 2
      until: openclaw_hermes_bridge_health.stdout == 'healthy'

    - name: Inspect the active Gateway mounts
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{{ '{{' }}json .Mounts{{ '}}' }}", openclaw-openclaw-gateway-1]
      become: true
      changed_when: false
      register: openclaw_gateway_mounts

    - name: Confirm the Gateway uses the intended sources
      ansible.builtin.assert:
        that:
          - >-
            ((openclaw_gateway_mounts.stdout | from_json)
            | selectattr('Destination', 'equalto', '/home/node/.openclaw/workspace/AGENTS.md')
            | map(attribute='Source') | list) == [openclaw_config_dir ~ '/ai-config/CLAUDE.md']
          - >-
            ((openclaw_gateway_mounts.stdout | from_json)
            | selectattr('Destination', 'equalto', '/home/node/.openclaw/workspace/obsidian-vault')
            | selectattr('RW', 'equalto', true)
            | map(attribute='Source') | list) == [openclaw_vault_path]
        fail_msg: Gateway mounts differ from the intended configuration; retain the old deployment.

    - name: Confirm OpenClaw can write to the shared Vault
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openclaw-openclaw-gateway-1
          - node
          - -e
          - require('fs').accessSync('/home/node/.openclaw/workspace/obsidian-vault', require('fs').constants.W_OK)
      become: true
      changed_when: false

    - name: Inspect the Cron shared-state MCP configuration
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openclaw-openclaw-gateway-1
          - node
          - dist/index.js
          - config
          - get
          - --json
          - mcp.servers.cron_shared_state
      become: true
      register: openclaw_cron_shared_state_mcp_current
      changed_when: false
      failed_when: false
      no_log: true

    - name: Configure the Cron shared-state MCP server
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openclaw-openclaw-gateway-1
          - node
          - dist/index.js
          - config
          - set
          - mcp.servers.cron_shared_state
          - "{{ openclaw.cron_shared_state_mcp | to_json }}"
          - --strict-json
      become: true
      register: openclaw_cron_shared_state_mcp_set
      changed_when: true
      when: >-
        openclaw_cron_shared_state_mcp_current.rc != 0 or
        (openclaw_cron_shared_state_mcp_current.stdout | from_json) != openclaw.cron_shared_state_mcp

    - name: Verify the Cron shared-state MCP server
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - openclaw-openclaw-gateway-1
          - node
          - dist/index.js
          - mcp
          - probe
          - cron_shared_state
          - --json
      become: true
      register: openclaw_cron_shared_state_mcp_probe
      changed_when: false
      retries: 3
      delay: 2
      until:
        - openclaw_cron_shared_state_mcp_probe.rc == 0
        - "'shared_state_get' in openclaw_cron_shared_state_mcp_probe.stdout"

- name: Configure OpenClaw reverse proxy access
  ansible.builtin.include_tasks: proxy.yml
  when: openclaw_proxy_enabled and not ansible_check_mode
