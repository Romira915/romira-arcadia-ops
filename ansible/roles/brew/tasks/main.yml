---
# tasks file for roles/brew
- name: Install homebrew package
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: true
    path: "{{ additional_path }}"
  loop: "{{ brew.package }}"
  when: brew.package is iterable
  tags:
    - brew

- name: Install extra homebrew packages
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: false
    path: "{{ additional_path }}"
  loop: "{{ brew_extra_packages }}"
  when: brew_extra_packages | length > 0
  tags:
    - brew

- name: Gather platform facts for Homebrew cask selection
  ansible.builtin.setup:
    gather_subset:
      - min
  tags:
    - brew
    - brew_shared_casks

- name: Install macOS-only homebrew cask packages
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    update_homebrew: true
    path: "{{ additional_path }}"
  loop: "{{ brew_macos_only_casks }}"
  when:
    - ansible_os_family == 'Darwin'
    - brew_macos_only_casks is defined
    - brew_macos_only_casks is iterable
  register: brew_cask_result
  failed_when:
    - brew_cask_result is failed
    - "'already installed' not in (brew_cask_result.msg | default(''))"
    - "'already an App' not in (brew_cask_result.msg | default(''))"
    - "'a password is required' not in (brew_cask_result.msg | default(''))"
  tags:
    - brew

- name: Install shared homebrew cask packages
  community.general.homebrew_cask:
    name: "{{ item.name }}"
    state: present
    update_homebrew: false
    path: "{{ additional_path }}"
  loop: "{{ brew_shared_casks }}"
  when: ansible_system in item.install_on
  tags:
    - brew
    - brew_shared_casks
