apt_defaults:
  dependencies:
    - "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version is version('8', '<')) | ternary('python-apt', 'python3-apt') }}"
    - aptitude
  repositories: []
  package: []
  install_state: present
  extra_install_state: latest

  manage_sources_list: false
  src_enable: true
  backports_enable: true
  ubuntu_mirror: mirror://mirrors.ubuntu.com/mirrors.txt
  ubuntu_security_mirror: http://security.ubuntu.com/ubuntu
  ubuntu_universe_enable: true
  ubuntu_multiverse_enable: true
  ubuntu_backports_enable: true
  ubuntu_partner_enable: false
  ubuntu_extras_enable: false
  debian_mirror: http://deb.debian.org/debian/
  debian_security_mirror: >-
    {{ (ansible_distribution == 'Debian' and ansible_distribution_major_version is version('10', '<=')) |
       ternary('http://security.debian.org/', 'http://security.debian.org/debian-security') }}
  debian_contrib_nonfree_enable: false
  update_enabled: true
  update_cache_valid_time: 3600
  upgrade: true
  upgrade_type: dist
  upgrade_dpkg_options:
    - force-confdef
    - force-confold

  dpkg_configure: false
  clean: true
  autoremove: true
  install: []
  remove: []
  remove_purge: false
  etc_apt_apt_conf: []
  etc_apt_apt_conf_d_files_absent: []
  apt_conf_file: /etc/apt/apt.conf
  debian_security_mirror_suffix: >-
    {{ (ansible_distribution == 'Debian' and ansible_distribution_major_version is version('10', '<=')) |
       ternary('/updates', '-security') }}
apt: {}  # noqa: var-naming[no-role-prefix]
